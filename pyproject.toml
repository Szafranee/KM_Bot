[project]
name = "km-bot"
version = "0.1.0"
description = "Telegram bot for searching Koleje Mazowieckie train information"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "bs4>=0.0.2",
    "google-genai>=1.0.0",
    "PyMuPDF>=1.25.3",
    "paramiko==5.0.0",
    "pysftp>=0.2.9",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.10",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
